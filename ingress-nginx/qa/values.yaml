# ingress-nginx qa values
controller:
  replicaCount: 1
  config:
    enable-underscores-in-headers: "true"

  nodeSelector:
    kubernetes.io/os: linux

  service:
    externalTrafficPolicy: Local
    loadBalancerIP: "XX.233.102.XXX"
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
      service.beta.kubernetes.io/azure-load-balancer-resource-group: "MC_mycluster-qa-apps-rg_mycluster-qa-aks_uaenorth"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

defaultBackend:
  nodeSelector:
    kubernetes.io/os: linux
  replicaCount: 1
